<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 700" role="img" aria-label="Diagramma della timeline dell'AI Act aggiornata ad agosto 2026: nella corsia superiore gli obblighi già in vigore (febbraio 2025 divieti e alfabetizzazione, agosto 2025 obblighi GPAI, 2 agosto 2026 trasparenza e sanzioni, 2 dicembre 2026 fine proroga watermarking); nella corsia inferiore i due blocchi rinviati, con la data originale barrata e una freccia verso la nuova scadenza: alto rischio stand-alone dell'Allegato III spostato dal 2 agosto 2026 al 2 dicembre 2027 (+16 mesi) e IA incorporata in prodotti regolamentati dell'Allegato I spostata dal 2 agosto 2027 al 2 agosto 2028 (+12 mesi).">
  <defs>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1620" height="700" fill="#ffffff"/>

  <!-- titolo -->
  <text x="60" y="46" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1e0c5c">AI Act: cosa è già obbligatorio, cosa è stato rinviato</text>
  <text x="60" y="74" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#737373">Le scadenze reali dopo il pacchetto di semplificazione 2026 · aggiornato al 31 agosto 2026</text>

  <!-- banda "passato / già in vigore" -->
  <rect x="290" y="145" width="507" height="455" fill="#f5f5f8"/>
  <text x="805" y="137" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#9a3412">oggi · 31 ago 2026</text>

  <!-- guide anno -->
  <g stroke="#f0f0f2" stroke-width="1">
    <line x1="588" y1="145" x2="588" y2="600"/>
    <line x1="902" y1="145" x2="902" y2="600"/>
    <line x1="1217" y1="145" x2="1217" y2="600"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a3a3a3" text-anchor="middle">
    <text x="444" y="620">2025</text>
    <text x="745" y="620">2026</text>
    <text x="1060" y="620">2027</text>
    <text x="1310" y="620">2028</text>
  </g>

  <!-- linee corsie -->
  <line x1="290" y1="300" x2="1410" y2="300" stroke="#d4d4d8" stroke-width="2"/>
  <line x1="290" y1="450" x2="1410" y2="450" stroke="#efefef" stroke-width="1.5"/>
  <line x1="290" y1="540" x2="1410" y2="540" stroke="#efefef" stroke-width="1.5"/>

  <!-- etichette corsie -->
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="end">
    <text x="272" y="296" font-size="13" font-weight="700" letter-spacing="1" fill="#1e0c5c">GIÀ IN VIGORE</text>
    <text x="272" y="313" font-size="11" fill="#8a8a8a">obblighi applicabili oggi</text>
    <text x="272" y="489" font-size="13" font-weight="700" letter-spacing="1" fill="#b45309">RINVIATO</text>
    <text x="272" y="506" font-size="11" fill="#8a8a8a">non cancellato</text>
  </g>

  <!-- ============ CORSIA IN VIGORE ============ -->
  <g font-family="Helvetica, Arial, sans-serif">

    <!-- feb 2025 (tier lontano, allineato a sinistra) -->
    <line x1="300" y1="216" x2="300" y2="292" stroke="#c8c8d0" stroke-width="1"/>
    <circle cx="300" cy="300" r="8" fill="#1e0c5c"/>
    <text x="292" y="158" font-size="14" font-weight="700" fill="#1e0c5c">FEBBRAIO 2025</text>
    <text x="292" y="178" font-size="12" fill="#484848">Divieto delle pratiche a</text>
    <text x="292" y="194" font-size="12" fill="#484848">rischio inaccettabile (Art. 5)</text>
    <text x="292" y="210" font-size="12" fill="#8a8a8a">+ alfabetizzazione IA (poi attenuata)</text>

    <!-- ago 2025 (tier vicino) -->
    <line x1="457" y1="280" x2="457" y2="292" stroke="#c8c8d0" stroke-width="1"/>
    <circle cx="457" cy="300" r="8" fill="#1e0c5c"/>
    <text x="457" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#1e0c5c">AGOSTO 2025</text>
    <text x="457" y="258" text-anchor="middle" font-size="12" fill="#484848">Obblighi per i fornitori di</text>
    <text x="457" y="274" text-anchor="middle" font-size="12" fill="#484848">modelli GPAI · avvio AI Office</text>

    <!-- 2 ago 2026 (tier lontano, evidenziato) -->
    <line x1="771" y1="216" x2="771" y2="290" stroke="#b45309" stroke-width="1.5"/>
    <circle cx="771" cy="300" r="11" fill="none" stroke="#b45309" stroke-width="2"/>
    <circle cx="771" cy="300" r="6" fill="#b45309"/>
    <text x="771" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">2 AGOSTO 2026</text>
    <text x="771" y="178" text-anchor="middle" font-size="12" fill="#484848">Trasparenza: chatbot, contenuti</text>
    <text x="771" y="194" text-anchor="middle" font-size="12" fill="#484848">generati e deepfake</text>
    <text x="771" y="210" text-anchor="middle" font-size="12" fill="#484848">Sanzioni pienamente applicabili</text>

    <!-- 2 dic 2026 (tier vicino) -->
    <line x1="876" y1="280" x2="876" y2="292" stroke="#c8c8d0" stroke-width="1"/>
    <circle cx="876" cy="300" r="8" fill="#1e0c5c"/>
    <text x="876" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#1e0c5c">2 DICEMBRE 2026</text>
    <text x="876" y="258" text-anchor="middle" font-size="12" fill="#484848">Fine proroga watermarking</text>
    <text x="876" y="274" text-anchor="middle" font-size="12" fill="#484848">+ due nuovi divieti</text>
  </g>

  <!-- ============ CORSIA RINVIATA ============ -->
  <g font-family="Helvetica, Arial, sans-serif">

    <!-- riga A: Allegato III -->
    <text x="760" y="454" text-anchor="end" font-size="12" fill="#484848">Alto rischio «stand-alone» (All. III): HR, credito, giustizia, istruzione</text>
    <circle cx="771" cy="450" r="7" fill="#ffffff" stroke="#c9a37a" stroke-width="2"/>
    <text x="771" y="476" text-anchor="middle" font-size="11" font-style="italic" fill="#a3a3a3">era: 2 ago 2026</text>
    <path d="M783,450 L1176,450" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrOrange)"/>
    <text x="976" y="438" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">+16 mesi</text>
    <circle cx="1191" cy="450" r="8" fill="#b45309"/>
    <text x="1208" y="447" font-size="13" font-weight="700" fill="#b45309">2 DICEMBRE 2027</text>
    <text x="1208" y="463" font-size="11" fill="#8a8a8a">nuova scadenza</text>

    <!-- riga B: Allegato I -->
    <text x="1075" y="544" text-anchor="end" font-size="12" fill="#484848">IA incorporata in prodotti già regolamentati (All. I): dispositivi medici, macchinari</text>
    <circle cx="1086" cy="540" r="7" fill="#ffffff" stroke="#c9a37a" stroke-width="2"/>
    <text x="1086" y="566" text-anchor="middle" font-size="11" font-style="italic" fill="#a3a3a3">era: 2 ago 2027</text>
    <path d="M1098,540 L1385,540" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrOrange)"/>
    <text x="1243" y="528" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">+12 mesi</text>
    <circle cx="1400" cy="540" r="8" fill="#b45309"/>
    <text x="1417" y="537" font-size="13" font-weight="700" fill="#b45309">2 AGOSTO 2028</text>
    <text x="1417" y="553" font-size="11" fill="#8a8a8a">nuova scadenza</text>
  </g>

  <!-- note -->
  <text x="60" y="656" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a">Il rinvio sposta le date di applicazione, non il contenuto degli obblighi: i sistemi ad alto rischio restano regolati, e la documentazione richiesta non si costruisce in poche settimane.</text>
  <text x="60" y="678" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#bdbdbd">Fonti: Regolamento (UE) 2024/1689 e pacchetto di semplificazione 2026 (&#171;Digital Omnibus&#187;). Elenco completo delle fonti in fondo all'articolo.</text>
</svg>
