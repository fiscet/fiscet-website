<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 660" role="img" aria-label="Timeline diagram showing that AI governance milestones consistently follow AI capability milestones, with the lag depending on whether the response is a voluntary standard (fast, about two months) or binding law (slow, about twenty-one months); it also shows US and EU regulatory paths diverging after January 2025, with the EU tightening and the US deregulating.">
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#484848"/>
    </marker>
    <marker id="arrowFork" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3412"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1560" height="660" fill="#ffffff"/>

  <text x="60" y="44" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1e0c5c">Capability moves first. Governance follows.</text>
  <text x="60" y="68" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#737373">AI technology milestones vs. governance &amp; regulatory response, 2017–2026</text>

  <!-- lane guide lines -->
  <line x1="90" y1="160" x2="1500" y2="160" stroke="#e5e5e5" stroke-width="2"/>
  <line x1="90" y1="410" x2="1500" y2="410" stroke="#e5e5e5" stroke-width="2"/>

  <!-- lane labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">
    <rect x="60" y="122" width="10" height="10" fill="#1e0c5c"/>
    <text x="76" y="131" fill="#1e0c5c">TECHNOLOGY</text>
    <rect x="60" y="372" width="10" height="10" fill="#b45309"/>
    <text x="76" y="381" fill="#b45309">GOVERNANCE &amp; REGULATION</text>
  </g>

  <!-- year reference ticks (loose reference only — see note) -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#a3a3a3">
    <line x1="150" y1="95" x2="150" y2="530" stroke="#f2f2f2" stroke-width="1"/>
    <text x="150" y="545" text-anchor="middle">2017</text>
    <line x1="380" y1="95" x2="380" y2="530" stroke="#f2f2f2" stroke-width="1"/>
    <text x="380" y="545" text-anchor="middle">2019</text>
    <line x1="680" y1="95" x2="680" y2="530" stroke="#f2f2f2" stroke-width="1"/>
    <text x="680" y="545" text-anchor="middle">2022–23</text>
  </g>

  <!-- TODAY marker -->
  <line x1="1500" y1="90" x2="1500" y2="600" stroke="#9a3412" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="1500" y="82" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#9a3412">TODAY — Aug 2026</text>

  <!-- ============ MECHANISM ARROWS (drawn first, so dots sit on top) ============ -->
  <path d="M680,172 C700,260 770,340 800,400" stroke="#484848" stroke-width="1.5" fill="none" stroke-dasharray="2 3" marker-end="url(#arrowGray)"/>
  <text x="600" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#484848">~2 months later</text>
  <text x="600" y="245" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a8a8a">(voluntary standard)</text>

  <path d="M690,172 C950,230 1150,260 1300,400" stroke="#484848" stroke-width="1.5" fill="none" stroke-dasharray="2 3" marker-end="url(#arrowGray)"/>
  <text x="990" y="185" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#484848">~21 months later</text>
  <text x="990" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a8a8a">(binding law)</text>

  <!-- ============ TECHNOLOGY DOTS ============ -->
  <g font-family="Helvetica, Arial, sans-serif">
    <circle cx="150" cy="160" r="8" fill="#1e0c5c"/>
    <text x="150" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1e0c5c">2017</text>
    <text x="150" y="197" text-anchor="middle" font-size="12" fill="#484848">Transformer architecture published</text>

    <circle cx="680" cy="160" r="8" fill="#1e0c5c"/>
    <text x="680" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1e0c5c">Nov 2022</text>
    <text x="680" y="197" text-anchor="middle" font-size="12" fill="#484848">ChatGPT reaches the public</text>
  </g>

  <!-- ============ GOVERNANCE DOTS ============ -->
  <g font-family="Helvetica, Arial, sans-serif">
    <!-- OECD: pre-boom, hollow marker -->
    <circle cx="380" cy="410" r="7" fill="#ffffff" stroke="#c2884a" stroke-width="2"/>
    <text x="380" y="440" text-anchor="middle" font-size="12" font-style="italic" fill="#8a8a8a">2019 — OECD AI Principles</text>
    <text x="380" y="455" text-anchor="middle" font-size="12" font-style="italic" fill="#8a8a8a">(pre-boom, aspirational)</text>

    <!-- NIST: label above (near) -->
    <circle cx="800" cy="410" r="7" fill="#b45309"/>
    <text x="800" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">Jan 2023</text>
    <text x="800" y="375" text-anchor="middle" font-size="12" fill="#484848">NIST AI RMF (voluntary)</text>

    <!-- Bletchley: label below (far) -->
    <circle cx="970" cy="410" r="7" fill="#b45309"/>
    <text x="970" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">Nov 2023</text>
    <text x="970" y="455" text-anchor="middle" font-size="12" fill="#484848">Bletchley Declaration</text>

    <!-- EU agreement: label above (near) -->
    <circle cx="1140" cy="410" r="7" fill="#b45309"/>
    <text x="1140" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">Dec 2023</text>
    <text x="1140" y="375" text-anchor="middle" font-size="12" fill="#484848">EU AI Act agreed + ISO 42001</text>

    <!-- EU in force: label below (far) -->
    <circle cx="1300" cy="410" r="7" fill="#b45309"/>
    <text x="1300" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">Aug 2024</text>
    <text x="1300" y="455" text-anchor="middle" font-size="12" fill="#484848">EU AI Act enters into force</text>
  </g>

  <!-- EU path continues solid to TODAY -->
  <path d="M1300,410 L1500,410" stroke="#b45309" stroke-width="2.5"/>
  <text x="1400" y="381" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b45309">EU: high-risk obligations</text>
  <text x="1400" y="395" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b45309">now in full effect</text>

  <!-- US path forks off, dashed -->
  <path d="M1300,410 C1340,455 1360,480 1390,505" stroke="#9a3412" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrowFork)"/>
  <text x="1400" y="500" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#9a3412">Jan 2025</text>
  <text x="1400" y="516" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9a3412">US: EO rescinded →</text>
  <text x="1400" y="531" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9a3412">deregulation policy</text>

  <text x="60" y="585" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#bdbdbd">Horizontal spacing after 2022 is compressed for legibility and is not strictly to scale — exact dates are labeled above each point.</text>
  <text x="60" y="630" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#a3a3a3">Sources: IBM, European Commission, NIST, Anthropic — verified dates as of August 2026. Full source list in the companion research note.</text>
</svg>
